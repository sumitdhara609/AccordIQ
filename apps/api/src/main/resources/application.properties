spring.application.name=accordiq-api

# ==========================================================
# PostgreSQL (Neon)
# ==========================================================
spring.datasource.url=jdbc:postgresql://ep-autumn-pond-az9c1btt-pooler.c-3.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_4KJDwipuUn9q
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================================
# JPA / Hibernate
# ==========================================================
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ==========================================================
# Actuator
# ==========================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ==========================================================
# Error Handling
# ==========================================================
server.error.include-message=always

# ==========================================================
# OCR (Tesseract)
# ==========================================================
ocr.tesseract.data-path=C:/Program Files/Tesseract-OCR/tessdata
ocr.tesseract.language=eng
ocr.tesseract.engine-mode=1
ocr.tesseract.page-segmentation-mode=3
# ==========================================================
# Gemini AI
# ==========================================================
ai.gemini.api-key=${GOOGLE_API_KEY}
ai.gemini.model=gemini-3.6-flash

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

springdoc.swagger-ui.path=/swagger

springdoc.default-produces-media-type=application/json