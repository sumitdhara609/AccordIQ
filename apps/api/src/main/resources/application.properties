###########################################################
# Application
###########################################################

spring.application.name=accordiq-api

###########################################################
# PostgreSQL (Neon)
###########################################################

spring.datasource.url=jdbc:postgresql://ep-autumn-pond-az9c1btt-pooler.c-3.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_4KJDwipuUn9q
spring.datasource.driver-class-name=org.postgresql.Driver

###########################################################
# JPA / Hibernate
###########################################################

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Hibernate automatically detects PostgreSQL
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

###########################################################
# File Upload
###########################################################

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

###########################################################
# Actuator
###########################################################

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

###########################################################
# Error Handling
###########################################################

server.error.include-message=always

###########################################################
# OCR (Tesseract)
###########################################################

ocr.tesseract.data-path=C:/Program Files/Tesseract-OCR/tessdata
ocr.tesseract.language=eng
ocr.tesseract.engine-mode=1
ocr.tesseract.page-segmentation-mode=3

###########################################################
# Gemini AI
###########################################################

gemini.api.key=${GEMINI_API_KEY}

gemini.model=gemini-2.5-flash

gemini.temperature=0.0

gemini.timeout=30s

###########################################################
# SpringDoc / Swagger
###########################################################

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger
springdoc.default-produces-media-type=application/json

###########################################################
# JWT
###########################################################

security.jwt.secret-key=e4thS6M+QvPenze4nYyPXGgLs63IDL6Je2SX6ayE53Czd5r75DbDpbXsddtzNTRMXyhwz9NzpP1tQlrcxodJtA==
security.jwt.expiration=86400000
security.jwt.refresh-expiration=604800000

###########################################################
# Logging
###########################################################

logging.level.com.accordiq=INFO
logging.level.org.springframework.web=INFO
logging.level.net.sourceforge.tess4j=INFO