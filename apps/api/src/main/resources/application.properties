# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ==========================================================
# Error Handling
# ==========================================================
server.error.include-message=always

#################################################
# OCR (Tesseract)
#################################################

accordiq.ocr.tesseract.data-path=C:/Program Files/Tesseract-OCR/tessdata
accordiq.ocr.tesseract.language=eng
accordiq.ocr.tesseract.engine-mode=1
accordiq.ocr.tesseract.page-segmentation-mode=3

# ==========================================================
# Gemini AI
# ==========================================================
ai.gemini.api-key=${GOOGLE_API_KEY}
ai.gemini.model=gemini-3.6-flash

# ==========================================================
# SpringDoc / Swagger
# ==========================================================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger
springdoc.default-produces-media-type=application/json

